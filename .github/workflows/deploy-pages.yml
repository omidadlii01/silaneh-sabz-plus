name: Deploy Web App to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Install admin panel dependencies
        run: npm install
        working-directory: ./admin

      - name: Build admin panel
        run: npm run build
        working-directory: ./admin
        env:
          BASE_PATH: /${{ github.event.repository.name }}/admin/

      - name: Install marketer app dependencies
        run: npm install
        working-directory: ./marketer

      - name: Build marketer app
        run: npm run build
        working-directory: ./marketer
        env:
          BASE_PATH: /${{ github.event.repository.name }}/marketer/

      - name: Merge admin build into main dist
        run: |
          mkdir -p dist/admin
          cp -r admin/dist/* dist/admin/

      - name: Merge marketer build into main dist
        run: |
          mkdir -p dist/marketer
          cp -r marketer/dist/* dist/marketer/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
