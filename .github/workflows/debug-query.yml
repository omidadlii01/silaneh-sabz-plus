name: Debug D1 Query

on:
  workflow_dispatch:
    inputs:
      sql:
        description: 'SQL query to run against the D1 database (remote)'
        required: true
        default: 'SELECT id, first_name, last_name, phone, store_name, active, created_at FROM customers ORDER BY id DESC LIMIT 10;'

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Patch database_id in wrangler.toml
        run: sed -i "s/PLACEHOLDER_WILL_BE_SET_BY_CI/704bcce1-92f4-42e2-85f7-0d5c3edffeb4/" wrangler.toml

      - name: Run query
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          OUT=$(npx wrangler d1 execute silaneh-sabz-db --remote --command "${{ github.event.inputs.sql }}" --json 2>&1)
          code=$?
          echo "$OUT"
          if [ $code -ne 0 ]; then
            msg=$(echo "$OUT" | tail -c 1800 | tr '\n' ' ' | tr '%' ' ')
            echo "::error::QUERY_FAILED: $msg"
            exit $code
          fi
          msg=$(echo "$OUT" | tail -c 1800 | tr '\n' ' ' | tr '%' ' ')
          echo "::notice::QUERY_RESULT: $msg"
