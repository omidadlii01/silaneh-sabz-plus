name: TEMP Quick Check

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Test signup and login fresh
        run: |
          set +e
          URL="https://silaneh-sabz-api.omidadli78.workers.dev"
          PHONE="09199$RANDOM"

          echo "Testing with phone: $PHONE"

          SIGNUP=$(curl -s -w "\n|HTTP_%{http_code}|TIME_%{time_total}" -X POST "$URL/api/marketer/signup" -H "Content-Type: application/json" -d "{\"first_name\":\"چک\",\"last_name\":\"سریع\",\"phone\":\"$PHONE\",\"password\":\"test1234\",\"region\":\"تهران\"}")
          echo "::notice::QUICK_SIGNUP result=$SIGNUP"

          LOGIN=$(curl -s -w "\n|HTTP_%{http_code}|TIME_%{time_total}" -X POST "$URL/api/marketer/login" -H "Content-Type: application/json" -d "{\"phone\":\"$PHONE\",\"password\":\"test1234\"}")
          echo "::notice::QUICK_LOGIN result=$LOGIN"

          # Check CORS preflight response explicitly (this is what browsers actually send first)
          PREFLIGHT=$(curl -s -i -X OPTIONS "$URL/api/marketer/signup" -H "Origin: https://omidadlii01.github.io" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type")
          echo "::notice::QUICK_PREFLIGHT headers=$PREFLIGHT"
