name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Sync Capacitor Android project
        run: |
          set +e
          npx cap sync android > cap_sync_output.log 2>&1
          code=$?
          cat cap_sync_output.log
          if [ $code -ne 0 ]; then
            msg=$(tail -c 1800 cap_sync_output.log | tr '\n' ' ' | tr '%' ' ')
            echo "::error::CAP_SYNC_FAILED: $msg"
            exit $code
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/silaneh-release.keystore

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: silaneh-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # versionCode must strictly increase for Android to accept an
          # install as an "update" rather than a downgrade. github.run_number
          # only ever goes up, so it's a safe, simple source for this.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: "1.${{ github.run_number }}"
        run: |
          set +e
          cd android
          ./gradlew assembleRelease --no-daemon > gradle_output.log 2>&1
          code=$?
          tail -c 4000 gradle_output.log
          if [ $code -ne 0 ]; then
            msg=$(tail -c 1800 gradle_output.log | tr '\n' ' ' | tr '%' ' ')
            echo "::error::GRADLE_FAILED: $msg"
            exit $code
          fi

      - name: Remove keystore from disk
        if: always()
        run: rm -f android/app/silaneh-release.keystore

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/silaneh-sabz-plus.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: silaneh-sabz-plus-release-apk
          path: android/app/build/outputs/apk/release/silaneh-sabz-plus.apk

      - name: Publish APK as public Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Silaneh Sabz Plus - Latest APK (v1.${{ github.run_number }})"
          body: "Automatically built, signed release APK. Direct download, no GitHub login required. Installing this over an existing install upgrades it in place (same signing key on every build)."
          files: android/app/build/outputs/apk/release/silaneh-sabz-plus.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
