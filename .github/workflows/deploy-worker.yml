name: Deploy Cloudflare Worker API

on:
  push:
    branches: [ main, master ]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Ensure D1 database exists and set its id in wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          LIST_JSON=$(npx wrangler d1 list --json 2>/dev/null || echo "[]")
          DB_ID=$(echo "$LIST_JSON" | node -e "
            let data='';
            process.stdin.on('data', d => data += d);
            process.stdin.on('end', () => {
              try {
                const arr = JSON.parse(data);
                const found = arr.find(d => d.name === 'silaneh-sabz-db');
                console.log(found ? found.uuid : '');
              } catch (e) { console.log(''); }
            });
          ")

          if [ -z "$DB_ID" ]; then
            echo "Database not found, creating..."
            CREATE_OUT=$(npx wrangler d1 create silaneh-sabz-db 2>&1)
            echo "$CREATE_OUT"
            DB_ID=$(echo "$CREATE_OUT" | grep -oP 'database_id = "\K[^"]+')
          fi

          if [ -z "$DB_ID" ]; then
            echo "::error::Could not determine D1 database_id"
            exit 1
          fi

          echo "Using database_id=$DB_ID"
          sed -i "s/PLACEHOLDER_WILL_BE_SET_BY_CI/$DB_ID/" wrangler.toml
          echo "::notice::D1_DATABASE_ID=$DB_ID"

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply silaneh-sabz-db --remote

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          DEPLOY_OUT=$(npx wrangler deploy 2>&1)
          code=$?
          echo "$DEPLOY_OUT"
          WORKER_URL=$(echo "$DEPLOY_OUT" | grep -oP 'https://[a-zA-Z0-9.-]+\.workers\.dev' | head -1)
          if [ -n "$WORKER_URL" ]; then
            echo "::notice::WORKER_URL=$WORKER_URL"
          else
            echo "::error::Could not find worker URL in deploy output"
          fi
          if [ $code -ne 0 ]; then
            msg=$(echo "$DEPLOY_OUT" | tail -c 1800 | tr '\n' ' ' | tr '%' ' ')
            echo "::error::DEPLOY_FAILED: $msg"
            exit $code
          fi
