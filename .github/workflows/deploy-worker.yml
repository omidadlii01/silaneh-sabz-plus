name: Deploy Cloudflare Worker API

on:
  push:
    branches: [ main, master ]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Ensure D1 database exists and set its id in wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          {
            LIST_JSON=$(npx wrangler d1 list --json 2>&1)
            echo "LIST_JSON output:"
            echo "$LIST_JSON"

            DB_ID=$(echo "$LIST_JSON" | node -e "
              let data='';
              process.stdin.on('data', d => data += d);
              process.stdin.on('end', () => {
                try {
                  const arr = JSON.parse(data);
                  const found = arr.find(d => d.name === 'silaneh-sabz-db');
                  console.log(found ? found.uuid : '');
                } catch (e) { console.log(''); }
              });
            " 2>/dev/null)

            if [ -z "$DB_ID" ]; then
              echo "Database not found, creating..."
              CREATE_OUT=$(npx wrangler d1 create silaneh-sabz-db 2>&1)
              echo "$CREATE_OUT"
              DB_ID=$(echo "$CREATE_OUT" | grep -oP 'database_id = "\K[^"]+')
              if [ -z "$DB_ID" ]; then
                DB_ID=$(echo "$CREATE_OUT" | grep -oP '"database_id":\s*"\K[^"]+' | head -1)
              fi
            fi

            if [ -z "$DB_ID" ]; then
              echo "::error::Could not determine D1 database_id. See log above."
              exit 1
            fi

            echo "Using database_id=$DB_ID"
            sed -i "s/PLACEHOLDER_WILL_BE_SET_BY_CI/$DB_ID/" wrangler.toml
            echo "::notice::D1_DATABASE_ID=$DB_ID"
          } 2>&1 | tee bootstrap_output.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            msg=$(tail -c 1800 bootstrap_output.log | tr '\n' ' ' | tr '%' ' ')
            echo "::error::BOOTSTRAP_FAILED: $msg"
            exit 1
          fi

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply silaneh-sabz-db --remote

      - name: Set Worker secrets (admin dashboard token)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: printf '%s' "${{ secrets.ADMIN_DASHBOARD_TOKEN }}" | npx wrangler secret put ADMIN_TOKEN

      - name: Set Worker secrets (Firebase service account, for push notifications)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SA" ]; then
            printf '%s' "$FIREBASE_SA" | npx wrangler secret put FIREBASE_SERVICE_ACCOUNT_JSON
          else
            echo "FIREBASE_SERVICE_ACCOUNT_JSON secret not set yet, skipping."
          fi

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          DEPLOY_OUT=$(npx wrangler deploy 2>&1)
          code=$?
          echo "$DEPLOY_OUT"
          WORKER_URL=$(echo "$DEPLOY_OUT" | grep -oP 'https://[a-zA-Z0-9.-]+\.workers\.dev' | head -1)
          if [ -n "$WORKER_URL" ]; then
            echo "::notice::WORKER_URL=$WORKER_URL"
          else
            echo "::error::Could not find worker URL in deploy output"
          fi
          if [ $code -ne 0 ]; then
            msg=$(echo "$DEPLOY_OUT" | tail -c 1800 | tr '\n' ' ' | tr '%' ' ')
            echo "::error::DEPLOY_FAILED: $msg"
            exit $code
          fi

      - name: Smoke test API (products, brands, admin auth)
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_DASHBOARD_TOKEN }}
        run: |
          set +e
          URL="https://silaneh-sabz-api.omidadli78.workers.dev"

          PRODUCTS=$(curl -s "$URL/api/products")
          PRODUCT_COUNT=$(echo "$PRODUCTS" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).products.length)}catch(e){console.log('PARSE_ERROR')}})")
          echo "Products count: $PRODUCT_COUNT"

          BRANDS=$(curl -s "$URL/api/brands")
          BRAND_COUNT=$(echo "$BRANDS" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).brands.length)}catch(e){console.log('PARSE_ERROR')}})")
          echo "Brands count: $BRAND_COUNT"
          BRAND_NAMES=$(echo "$BRANDS" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const b=JSON.parse(d).brands;console.log(b.map(x=>x.id+':'+x.name+':img='+(!!x.imageUrl)).join(' | '))}catch(e){console.log('PARSE_ERROR')}})")
          echo "::notice::BRAND_LIST $BRAND_NAMES"
          OLD_BRAND_DETAILS=$(echo "$BRANDS" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const b=JSON.parse(d).brands.filter(x=>/^b[0-9]+$/.test(x.id));console.log(JSON.stringify(b))}catch(e){console.log('PARSE_ERROR')}})")
          echo "::notice::OLD_BRAND_DETAILS $OLD_BRAND_DETAILS"

          NO_AUTH=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/admin/stats")
          echo "Admin stats without token (expect 401): $NO_AUTH"

          WITH_AUTH=$(curl -s -H "X-Admin-Token: $ADMIN_TOKEN" "$URL/api/admin/stats")
          echo "Admin stats with token: $WITH_AUTH"

          echo "::notice::SMOKE2 products=$PRODUCT_COUNT brands=$BRAND_COUNT no_auth_status=$NO_AUTH admin_stats=$WITH_AUTH"

      - name: Smoke test API (signup, duplicate check, login)
        run: |
          set +e
          URL="https://silaneh-sabz-api.omidadli78.workers.dev"
          PHONE="09120000$RANDOM"

          SIGNUP1=$(curl -s -X POST "$URL/api/signup" -H "Content-Type: application/json" -d "{\"firstName\":\"تست\",\"lastName\":\"تستی\",\"phone\":\"$PHONE\",\"storeName\":\"فروشگاه تست\",\"businessType\":\"داروخانه\",\"address\":\"تهران\"}")
          echo "Signup 1: $SIGNUP1"

          SIGNUP2=$(curl -s -X POST "$URL/api/signup" -H "Content-Type: application/json" -d "{\"firstName\":\"تست٢\",\"lastName\":\"تستی٢\",\"phone\":\"$PHONE\",\"storeName\":\"فروشگاه دو\",\"businessType\":\"داروخانه\",\"address\":\"تهران\"}")
          echo "Signup 2 (should be duplicate error): $SIGNUP2"

          LOGIN=$(curl -s -X POST "$URL/api/login" -H "Content-Type: application/json" -d "{\"phone\":\"$PHONE\"}")
          echo "Login: $LOGIN"

          echo "::notice::SMOKE_TEST_RESULTS signup1=$SIGNUP1 || signup2_dup=$SIGNUP2 || login=$LOGIN"

      - name: Smoke test API (marketer signup, pending login, admin activate, active login, customer+order+notification flow)
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_DASHBOARD_TOKEN }}
        run: |
          set +e
          URL="https://silaneh-sabz-api.omidadli78.workers.dev"
          MPHONE="09130000$RANDOM"

          MSIGNUP=$(curl -s -X POST "$URL/api/marketer/signup" -H "Content-Type: application/json" -d "{\"first_name\":\"تست\",\"last_name\":\"بازاریاب\",\"phone\":\"$MPHONE\",\"password\":\"pass1234\",\"region\":\"تهران\"}")
          MLOGIN_PENDING=$(curl -s -w "|HTTP_%{http_code}" -X POST "$URL/api/marketer/login" -H "Content-Type: application/json" -d "{\"phone\":\"$MPHONE\",\"password\":\"pass1234\"}")
          MID=$(echo "$MSIGNUP" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).marketer.id)}catch(e){console.log('')}})")
          echo "::notice::MARKETER_SIGNUP_STEP mid=$MID signup=$MSIGNUP pending_login=$MLOGIN_PENDING"

          ACTIVATE=$(curl -s -X PATCH "$URL/api/admin/marketers/$MID" -H "Content-Type: application/json" -H "X-Admin-Token: $ADMIN_TOKEN" -d '{"active":true}')
          MLOGIN_OK=$(curl -s -X POST "$URL/api/marketer/login" -H "Content-Type: application/json" -d "{\"phone\":\"$MPHONE\",\"password\":\"pass1234\"}")
          echo "::notice::MARKETER_ACTIVATE_STEP activate=$ACTIVATE login_ok=$MLOGIN_OK"

          CPHONE="09140000$RANDOM"
          NEWCUST=$(curl -s -X POST "$URL/api/marketer/$MID/customers" -H "Content-Type: application/json" -d "{\"firstName\":\"مشتری\",\"lastName\":\"تست\",\"phone\":\"$CPHONE\",\"storeName\":\"فروشگاه تست بازاریاب\",\"businessType\":\"pharmacy\",\"address\":\"تهران\"}")
          CID=$(echo "$NEWCUST" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).customer.id)}catch(e){console.log('')}})")
          echo "::notice::MARKETER_NEWCUST_STEP cid=$CID newcust=$NEWCUST"

          NEWORDER=$(curl -s -X POST "$URL/api/orders" -H "Content-Type: application/json" -d "{\"customerId\":$CID,\"items\":[{\"product_id\":\"sb-test\",\"product_name\":\"محصول تست\",\"quantity\":1,\"unit_price\":100000,\"total_price\":100000}],\"initialAmount\":100000,\"discount\":0,\"finalAmount\":100000,\"customerNote\":\"تست\"}")
          OID=$(echo "$NEWORDER" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).orderId)}catch(e){console.log('')}})")
          echo "::notice::MARKETER_NEWORDER_STEP oid=$OID neworder=$NEWORDER"

          MORDERS=$(curl -s "$URL/api/marketer/$MID/orders")
          MORDER_COUNT=$(echo "$MORDERS" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).orders.length)}catch(e){console.log('PARSE_ERROR:'+d.slice(0,200))}})")

          STATUSCHANGE=$(curl -s -X PATCH "$URL/api/orders/$OID/status" -H "Content-Type: application/json" -d '{"status":"confirmed","marketer_note":"تایید شد توسط تست خودکار"}')

          MNOTIFS=$(curl -s "$URL/api/marketer/$MID/notifications")
          MNOTIF_COUNT=$(echo "$MNOTIFS" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).notifications.length)}catch(e){console.log('PARSE_ERROR:'+d.slice(0,200))}})")

          echo "::notice::MARKETER_SMOKE_FINAL statuschange=$STATUSCHANGE notif_count=$MNOTIF_COUNT summary mid=$MID cid=$CID oid=$OID orders_count=$MORDER_COUNT"

          # --- CROSS-APP CHECK: verify a marketer-created customer/order is actually
          #     visible through the CUSTOMER app's own endpoints (this is the exact
          #     path the customer app uses; regressions here are otherwise invisible
          #     to the marketer-only smoke test above) ---
          CUSTLOGIN=$(curl -s -X POST "$URL/api/login" -H "Content-Type: application/json" -d "{\"phone\":\"$CPHONE\"}")
          CUSTORDERS=$(curl -s "$URL/api/customers/$CID/orders")
          CUSTORDER_COUNT=$(echo "$CUSTORDERS" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).orders.length)}catch(e){console.log('PARSE_ERROR:'+d.slice(0,200))}})")
          CUSTORDER_HAS_OID=$(echo "$CUSTORDERS" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).orders.some(o=>String(o.id)===String($OID)))}catch(e){console.log('PARSE_ERROR')}})")

          echo "::notice::CROSS_APP_VISIBILITY_CHECK customer_login=$CUSTLOGIN customer_orders_count=$CUSTORDER_COUNT contains_marketer_order=$CUSTORDER_HAS_OID"
