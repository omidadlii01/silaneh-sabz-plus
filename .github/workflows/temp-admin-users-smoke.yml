name: temp-admin-users-smoke
on: workflow_dispatch
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Test admin_users flow
        run: |
          BASE="https://silaneh-sabz-api.omidadli78.workers.dev"
          PHONE="09120000$RANDOM"

          SIGNUP=$(curl -s -X POST "$BASE/api/admin/user-signup" -H "Content-Type: application/json" \
            -d "{\"first_name\":\"تست\",\"last_name\":\"مدیر\",\"phone\":\"$PHONE\",\"password\":\"pass123\"}")
          echo "::notice::SIGNUP=$SIGNUP"

          LOGIN=$(curl -s -X POST "$BASE/api/admin/user-login" -H "Content-Type: application/json" \
            -d "{\"phone\":\"$PHONE\",\"password\":\"pass123\"}")
          echo "::notice::LOGIN=$LOGIN"
          SESSION=$(echo "$LOGIN" | python3 -c "import json,sys; print(json.load(sys.stdin)['session'])")
          UID=$(echo "$LOGIN" | python3 -c "import json,sys; print(json.load(sys.stdin)['adminUser']['id'])")

          ME=$(curl -s "$BASE/api/admin/me" -H "X-Admin-Session: $SESSION")
          echo "::notice::ME=$ME"

          NOAUTH=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/api/admin/users")
          echo "::notice::NOAUTH_STATUS=$NOAUTH"

          LIST_WITH_TOKEN=$(curl -s "$BASE/api/admin/users" -H "X-Admin-Token: ${{ secrets.ADMIN_DASHBOARD_TOKEN }}")
          echo "::notice::LIST_LEN=$(echo "$LIST_WITH_TOKEN" | python3 -c "import json,sys; print(len(json.load(sys.stdin)['adminUsers']))")"

          APPROVE=$(curl -s -X PATCH "$BASE/api/admin/users/$UID" -H "Content-Type: application/json" \
            -H "X-Admin-Token: ${{ secrets.ADMIN_DASHBOARD_TOKEN }}" -d '{"role":"مدیر فروش"}')
          echo "::notice::APPROVE=$APPROVE"

          ME_AFTER=$(curl -s "$BASE/api/admin/me" -H "X-Admin-Session: $SESSION")
          echo "::notice::ME_AFTER_APPROVE=$ME_AFTER"

          MARKETER_CREATE=$(curl -s -X POST "$BASE/api/admin/marketers" -H "Content-Type: application/json" \
            -H "X-Admin-Token: ${{ secrets.ADMIN_DASHBOARD_TOKEN }}" \
            -d "{\"first_name\":\"بازاریاب\",\"last_name\":\"تست۲\",\"phone\":\"0913$RANDOM\",\"region\":\"تهران\",\"monthly_target\":1000000}")
          echo "::notice::MARKETER_CREATE=$MARKETER_CREATE"

          OFFERS=$(curl -s "$BASE/api/admin/weekly-offers" -H "X-Admin-Token: ${{ secrets.ADMIN_DASHBOARD_TOKEN }}")
          echo "::notice::OFFERS_COUNT=$(echo "$OFFERS" | python3 -c "import json,sys; print(len(json.load(sys.stdin)['offers']))")"

          CUSTOMERS=$(curl -s "$BASE/api/admin/customers" -H "X-Admin-Token: ${{ secrets.ADMIN_DASHBOARD_TOKEN }}")
          echo "::notice::CUSTOMERS_SAMPLE=$(echo "$CUSTOMERS" | python3 -c "import json,sys; d=json.load(sys.stdin)['customers']; print(d[0] if d else 'EMPTY')")"

          ORDERS=$(curl -s "$BASE/api/admin/orders" -H "X-Admin-Token: ${{ secrets.ADMIN_DASHBOARD_TOKEN }}")
          echo "::notice::ORDERS_SAMPLE=$(echo "$ORDERS" | python3 -c "import json,sys; d=json.load(sys.stdin)['orders']; print(d[0] if d else 'EMPTY')")"
