<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>سیلانه سبز پلاس | سفارش عمده FMCG</title>
    <meta name="description" content="سامانه سفارش‌دهی عمده محصولات آرایشی، بهداشتی و دارویی سیلانه سبز" />
    <meta name="theme-color" content="#0f5338" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="سیلانه سبز" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
    <style>
      @font-face {
        font-family: 'Material Symbols Outlined';
        font-style: normal;
        font-weight: 100 700;
        font-display: block;
        src: url('%BASE_URL%fonts/material-symbols-outlined.woff2') format('woff2');
      }
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined';
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-feature-settings: 'liga';
        -webkit-font-smoothing: antialiased;
        vertical-align: middle;
        font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
      }
    </style>
  </head>
  <body class="bg-gray-50 text-slate-800 antialiased font-sans dir-rtl selection:bg-emerald-200">
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f5338;
      }
      #app-splash .splash-ring-wrap {
        position: relative;
        width: 128px;
        height: 128px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app-splash .splash-ring {
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #34d399;
        animation: app-splash-spin 1s linear infinite;
      }
      #app-splash .splash-circle {
        width: 100px;
        height: 100px;
        border-radius: 9999px;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
        overflow: hidden;
      }
      #app-splash .splash-circle img {
        width: 68%;
        height: 68%;
        object-fit: contain;
      }
      #app-splash.splash-hidden {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s ease;
      }
      @keyframes app-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <div id="app-splash">
      <div class="splash-ring-wrap">
        <div class="splash-ring"></div>
        <div class="splash-circle">
          <img src="%BASE_URL%splash-mark.png" alt="سیلانه سبز" />
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
